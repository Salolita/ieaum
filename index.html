<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100c17">
  <meta name="description" content="درگاه مهندسان صنایع دانشگاه آزاد مشهد، معرفی نامرالب و مسیر ارتباطی IEAUM در تلگرام.">
  <title>IEAUM</title>
  <link rel="icon" href="./assets/mark-v2.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/ieaum-shell.css">
</head>
<body>
  <a class="skip" href="#main">رفتن به محتوای اصلی</a>
  <header class="ieaum-header">
    <a class="ieaum-brand" href="/" aria-label="صفحهٔ اصلی IEAUM"><img class="ieaum-symbol" src="/ieaum-shell-mark.png" width="40" height="40" alt=""><b dir="ltr">IEAUM</b></a>
    <nav class="ieaum-nav" aria-label="منوی اصلی">
      <a href="/#services">سرویس‌ها</a>
      <a href="/#about">دربارهٔ ما</a>
    </nav>
    <div class="ieaum-shell-actions"><a class="ieaum-shell-link" href="/panel/"><span data-panel-label>ورود به پنل</span> <span aria-hidden="true">↗</span></a></div>
  </header>

  <main class="wrap" id="main">
    <div class="home-content-status" id="home-content-status">
      <p role="status" id="home-content-message">در حال دریافت محتوای صفحه…</p>
      <button class="button secondary" type="button" id="retry-home-content" hidden>تلاش دوباره</button>
    </div>
    <p id="account-status" class="account-status" role="status" hidden></p>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow"><span aria-hidden="true"></span><b data-content="heroLabel"></b></p>
        <h1 id="hero-title"><b data-content="heroTitle"></b><span data-content="heroSubtitle"></span></h1>
        <p class="intro" data-content="heroIntro"></p>
        <p class="entry-guide" data-content="entryGuide"></p>
        <div class="actions">
          <a class="button primary" href="/panel/"><span data-panel-label>ورود به پنل</span> <span aria-hidden="true">↗</span></a>
          <a class="button secondary" href="https://t.me/ieaumbot">ربات تلگرام <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <figure class="artwork">
        <img src="./assets/group-artwork.jpg" width="1120" height="1120" alt="طرح گروه با نوشتهٔ Azad University، حروف سفید و سایهٔ تیره روی زمینهٔ بنفش">
      </figure>
    </section>

    <div class="home-text-sections" data-home-sections="intro"></div>
    <section class="services" id="services" aria-labelledby="services-title">
      <div class="section-heading">
        <h2 id="services-title" data-content="servicesTitle"></h2>
        <span aria-hidden="true"></span>
      </div>
      <div class="service-grid" id="home-services"></div>
    </section>

    <div class="home-text-sections" data-home-sections="services"></div>
    <section class="about" id="about" aria-labelledby="about-title">
      <h2 id="about-title" data-content="aboutTitle"></h2>
      <p data-content="aboutText"></p>
    </section>
    <div class="home-text-sections" data-home-sections="about"></div>
    <section class="site-comments" id="comments" aria-labelledby="comments-heading">
      <div class="section-heading"><h2 id="comments-heading" data-content="commentsTitle">نظرات</h2><span aria-hidden="true"></span></div>
      <p id="comments-signin" hidden>برای ارسال نظر <a href="/panel/">وارد حساب IEAUM شوید</a>.</p>
      <form id="comment-form" hidden>
        <fieldset>
          <legend>شیوهٔ ارسال</legend>
          <label><input type="radio" name="visibility" value="public" required> انتشار نظر در سایت</label>
          <label><input type="radio" name="visibility" value="private" required> ارسال خصوصی برای مدیر</label>
        </fieldset>
        <label for="comment-message">نظر شما</label>
        <textarea id="comment-message" name="message" rows="3" maxlength="1200" required></textarea>
        <button class="button primary" type="submit">ارسال نظر</button>
      </form>
      <p id="comments-feedback" role="status"></p>
      <div class="comments-views" aria-label="فهرست نظرات">
        <button type="button" class="button secondary" data-comment-view="public" aria-pressed="true">نظرات عمومی</button>
        <button type="button" class="button secondary" data-comment-view="mine" aria-pressed="false" hidden>پیام‌های خصوصی من</button>
        <button type="button" class="button secondary" data-comment-view="manage" aria-pressed="false" hidden>مدیریت نظرات</button>
      </div>
      <div id="comments-list" aria-live="polite"><p>در حال دریافت نظرات…</p></div>
      <div class="comments-pages" hidden>
        <button type="button" class="button secondary" id="comments-prev">صفحهٔ قبل</button>
        <span id="comments-page"></span>
        <button type="button" class="button secondary" id="comments-next">صفحهٔ بعد</button>
      </div>
    </section>
  </main>
  <footer class="ieaum-footer">
    <a class="ieaum-footer-brand" href="/"><img class="ieaum-symbol" src="/ieaum-shell-mark.png" width="30" height="30" alt=""><span data-content="footerText"></span></a>
    <div class="ieaum-footer-actions"><a href="/contact/">ارتباط با ما</a><button type="button" class="button secondary" id="edit-home" hidden>مدیریت محتوا</button></div>
  </footer>
  <dialog class="content-editor" id="home-editor" aria-labelledby="home-editor-title">
    <h2 id="home-editor-title">مدیریت محتوای صفحهٔ اصلی</h2>
    <form id="home-editor-form">
      <div id="home-editor-fields"></div>
      <div id="home-service-editor"></div>
      <button type="button" class="button secondary" id="add-home-service">افزودن سرویس</button>
      <div id="home-section-editor"></div>
      <button type="button" class="button secondary" id="add-home-section">افزودن بخش متنی</button>
      <p id="home-editor-error" role="alert"></p>
      <div class="actions">
        <button class="button primary" type="submit">ذخیرهٔ محتوا</button>
        <button class="button secondary" type="button" id="close-home-editor">انصراف</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/home-session.ts"></script>
  <script type="module" src="/site-comments.ts"></script>
</body>
</html>
